name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GuardianBateria-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar APK como Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GuardianBateria.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest GuardianBateria.apk --clobber
          else
            gh release create latest GuardianBateria.apk --title "Guardián de Batería (última versión)" \
              --notes "Descarga GuardianBateria.apk desde el celular e instálala (Android 8.0+). Incluye atajos para Xiaomi/HyperOS."
          fi
